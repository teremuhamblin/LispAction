# 🤝 Contribuer à LispAction

Merci de contribuer à LispAction !

## 🟩 Règles de contribution
- Code propre, lisible, commenté.
- Tests obligatoires pour toute nouvelle fonctionnalité.
- Respect du style du projet.
- Les PR doivent être petites et ciblées.

## 🛠 Workflow
1. Fork du dépôt
2. Nouvelle branche : `feature/nom`
3. Commits propres
4. PR vers `main`

## 🧪 Tests
Les tests doivent être ajoutés dans `tests/`.

## 📦 CI
Toute PR doit passer la CI GitHub Actions.
