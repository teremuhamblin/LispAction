name: "Bug Report"
description: "Signaler un bug dans LispAction"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description du problème"
      placeholder: "Décris le bug rencontré..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire"
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
      placeholder: "Ce qui aurait dû se passer..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Stacktrace"
      placeholder: "Colle ici les logs si disponibles"
